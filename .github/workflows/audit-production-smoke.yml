name: Audit Vercel production and preview diagnostics

on:
  push:
    branches: [audit/api-flow-hardening-20261029]

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect public production and protected preview responses
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: \${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const targets = [
            ["portfolio home", "https://luxjson.is-a.dev/"],
            ["production API health", "https://api.luxjson.is-a.dev/api/health"],
            ["production blog list", "https://api.luxjson.is-a.dev/api/blog/posts?limit=5&publishedOnly=true"],
            ["production OpenAPI", "https://api.luxjson.is-a.dev/swagger.json"],
            ["production Scalar docs", "https://api.luxjson.is-a.dev/docs"],
            ["production API root", "https://api.luxjson.is-a.dev/"],
            ["branch preview health", "https://api-git-audit-api-flow-hardening-20261029-luxjson.vercel.app/api/health"],
            ["branch preview OpenAPI", "https://api-git-audit-api-flow-hardening-20261029-luxjson.vercel.app/swagger.json"],
          ];
          const headers = process.env.VERCEL_AUTOMATION_BYPASS_SECRET
            ? { "x-vercel-protection-bypass": process.env.VERCEL_AUTOMATION_BYPASS_SECRET }
            : {};
          const results = [];

          for (const [label, url] of targets) {
            try {
              const response = await fetch(url, {
                headers,
                redirect: "manual",
                signal: AbortSignal.timeout(15000),
              });
              const body = (await response.text()).slice(0, 220).replace(/[\r\n]+/g, " ");
              results.push({
                label,
                status: response.status,
                contentType: response.headers.get("content-type"),
                server: response.headers.get("server"),
                vercelId: response.headers.get("x-vercel-id"),
                body,
              });
            } catch (error) {
              results.push({ label, error: error?.message || "request failed" });
            }
          }

          const cors = await fetch("https://api.luxjson.is-a.dev/api/blog/posts", {
            method: "OPTIONS",
            headers: {
              ...headers,
              Origin: "https://luxjson.is-a.dev",
              "Access-Control-Request-Method": "GET",
              "Access-Control-Request-Headers": "accept",
            },
            signal: AbortSignal.timeout(15000),
          }).catch((error) => ({ status: 0, headers: new Headers(), error }));

          results.push({
            label: "production CORS preflight",
            status: cors.status,
            allowOrigin: cors.headers?.get?.("access-control-allow-origin") || null,
            error: cors.error?.message,
          });
          console.log(JSON.stringify(results, null, 2));

          const productionHealth = results.find((entry) => entry.label === "production API health");
          if (productionHealth?.status !== 200) {
            throw new Error("Production API health is not HTTP 200; deployment remains blocked.");
          }
          NODE