name: Audit production integration smoke

on:
  push:
    branches: [audit/api-flow-hardening-20261029]

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public site and API contracts
        run: |
          node --input-type=module <<'NODE'
          const checks = [];
          async function request(label, url, options = {}) {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000), ...options });
            checks.push({ label, status: response.status });
            if (!response.ok) throw new Error(label + " returned HTTP " + response.status);
            return response;
          }

          const site = await request("portfolio home", "https://luxjson.is-a.dev/");
          const siteHtml = await site.text();
          if (!/<title>luxjson<\\/title>/i.test(siteHtml)) throw new Error("Portfolio HTML title is missing.");

          const health = await request("API health", "https://api.luxjson.is-a.dev/api/health");
          const healthJson = await health.json();
          if (healthJson.status !== "ok") throw new Error("API health did not report status=ok.");

          const blog = await request("published blog list", "https://api.luxjson.is-a.dev/api/blog/posts?limit=5&publishedOnly=true");
          const blogJson = await blog.json();
          if (blogJson.success !== true || !Array.isArray(blogJson.posts)) throw new Error("Published blog list contract is invalid.");

          const specResponse = await request("OpenAPI document", "https://api.luxjson.is-a.dev/swagger.json");
          const spec = await specResponse.json();
          if (!spec.paths?.["/api/blog/posts"] || !spec.paths?.["/api/community/posts"]) throw new Error("OpenAPI document is missing route contracts.");

          await request("Scalar docs", "https://api.luxjson.is-a.dev/docs");
          await request("API landing page", "https://api.luxjson.is-a.dev/");

          const preflight = await fetch("https://api.luxjson.is-a.dev/api/blog/posts", {
            method: "OPTIONS",
            headers: {
              Origin: "https://luxjson.is-a.dev",
              "Access-Control-Request-Method": "GET",
              "Access-Control-Request-Headers": "accept",
            },
            signal: AbortSignal.timeout(15000),
          });
          checks.push({ label: "site-to-API CORS preflight", status: preflight.status });
          if (preflight.status !== 204 || preflight.headers.get("access-control-allow-origin") !== "https://luxjson.is-a.dev") {
            throw new Error("The production API does not allow the portfolio origin.");
          }

          console.log(JSON.stringify(checks));
          NODE