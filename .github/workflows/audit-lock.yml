name: Regenerate and verify API lockfile

on:
  push:
    branches: [audit/api-flow-hardening-20261029]

permissions:
  contents: write

jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: false
      - name: Regenerate package lock from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile to audit branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(api): synchronize package lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "package-lock.json is already synchronized."
          fi
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run check
