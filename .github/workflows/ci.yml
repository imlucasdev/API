name: API Verification

on:
  push:
    branches: [main, security/layered-api-hardening-20261028, audit/api-flow-hardening-20261029]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e "const a=JSON.parse(require('fs').readFileSync('audit-report.json','utf8')); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name + ' | severity=' + v.severity + ' | range=' + v.range + ' | direct=' + v.isDirect + ' | fixAvailable=' + JSON.stringify(v.fixAvailable));"
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run check
